<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Focus · Three</title>
  <link rel="stylesheet" href="block.css">
  <script type="module" src="block.js"></script>
</head>
<body>
  <main>
    <p id="meta" class="meta"></p>
    <h1 class="focus"><span id="dot" class="dot" hidden></span><span id="title"></span></h1>
    <p id="time" class="display" role="timer"></p>
    <p id="until" class="body secondary"></p>
    <div class="actions">
      <a id="open" class="button primary" hidden></a>
      <button id="back" type="button" class="button primary" autofocus>Back to work</button>
    </div>
    <div class="fine">
      <p id="how" class="meta"></p>
      <p id="connection" class="meta" hidden>Three isn't connected right now.</p>
      <p class="meta">Three saves only that a rule matched and when, never this page's address.</p>
    </div>
  </main>
</body>
</html>
